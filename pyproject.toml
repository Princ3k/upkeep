[project]
name = "upkeep"
version = "0.0.1"
description = "Watch an API surface, find affected call sites, write the migration, prove it works."
requires-python = ">=3.11"
dependencies = [
  "libcst>=1.4",
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only reading migration guides needs a model. The pipeline — diff, index, plan,
# patch, verify — runs without it, and should stay that way.
anthropic = ["anthropic>=1.5"]
google = ["google-genai>=2.0"]
extract = ["anthropic>=1.5", "google-genai>=2.0"]

[project.scripts]
upkeep = "upkeep.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
